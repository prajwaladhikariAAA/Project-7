[project]
name = "project-7"
version = "0.1.0"
description = "Data-tech tooling for accounting firms — a modular monorepo where each tool is its own package and Cursor skill."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accounting-core",
    "ledger-reconciler",
    "tax-calculator",
    "pdf-statement-converter",
    "statement-web",
]

# The workspace root is not a distributable package itself; it only ties the
# members together so they can be developed and linked from one virtualenv.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "tools/*", "apps/*"]

# Every workspace member resolves to its local source, so tools can depend on
# one another (or on the shared core) without publishing to a registry.
[tool.uv.sources]
accounting-core = { workspace = true }
ledger-reconciler = { workspace = true }
tax-calculator = { workspace = true }
pdf-statement-converter = { workspace = true }
statement-web = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    # Used only to generate a sample PDF for the converter's integration test.
    "reportlab>=4.0",
    # Used by FastAPI's TestClient for the web app tests.
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI relies on calls like File()/Form()/Depends() in argument defaults.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["packages", "tools", "apps"]
