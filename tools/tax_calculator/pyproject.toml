[project]
name = "tax-calculator"
version = "0.1.0"
description = "Compute sales tax / VAT for invoice line items."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["accounting-core"]

[project.entry-points."accounting.tools"]
tax_calculator = "tax_calculator:get_tool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax_calculator"]

[tool.uv.sources]
accounting-core = { workspace = true }
