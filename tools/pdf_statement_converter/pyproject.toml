[project]
name = "pdf-statement-converter"
version = "0.1.0"
description = "Convert a bank statement PDF into a CSV of transactions, fully offline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accounting-core",
    "pdfplumber>=0.11",
]

[project.entry-points."accounting.tools"]
pdf_statement_converter = "pdf_statement_converter:get_tool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_statement_converter"]

[tool.uv.sources]
accounting-core = { workspace = true }
