[project]
name = "statement-web"
version = "0.1.0"
description = "Web app to convert bank-statement PDFs to CSV and export the results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accounting-core",
    "pdf-statement-converter",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
statement-web = "statement_web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statement_web"]

[tool.uv.sources]
accounting-core = { workspace = true }
pdf-statement-converter = { workspace = true }
